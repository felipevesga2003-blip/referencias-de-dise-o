<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Referencias de diseño</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<style>
:root{--bg:#eceef7;--side:#fff;--pan:#fff;--pan2:#f1f2fa;--ink:#14152b;--mut:#6b6e8f;--line:#e2e4f2;--acc:#4f55c8;--onacc:#fff;--sh:0 8px 30px rgba(40,44,100,.08);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d1a;--side:#141527;--pan:#1a1c2e;--pan2:#22243a;--ink:#f5f5ff;--mut:#8b8da6;--line:#262843;--acc:#5a60d6;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d1a;--side:#141527;--pan:#1a1c2e;--pan2:#22243a;--ink:#f5f5ff;--mut:#8b8da6;--line:#262843;--acc:#5a60d6;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .25s,color .25s}
h1,h2,h3,.brand{font-family:"Sora","DM Sans",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
input,select,button{font:inherit;color:var(--ink)}
button{cursor:pointer}
.app{display:grid;grid-template-columns:84px 1fr;min-height:100vh}
aside.nav{background:var(--side);display:flex;flex-direction:column;align-items:center;padding:22px 0;gap:6px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line)}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#7c83ff,#3a3f9e);display:grid;place-items:center;color:#fff;font:700 18px Sora,sans-serif;margin-bottom:4px}
.brand{font-size:12px;font-weight:600;margin-bottom:26px}
.ni{position:relative;width:46px;height:46px;border-radius:14px;border:0;background:none;color:var(--mut);display:grid;place-items:center;font:600 14px Sora,sans-serif;transition:.15s}
.ni:hover{background:var(--pan2);color:var(--ink)}
.ni.on{background:var(--pan2);color:var(--acc)}
.ni.on::before{content:"";position:absolute;left:-19px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--acc)}
.sp{flex:1}
.theme{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--pan2);display:grid;place-items:center}
.theme svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.sun{display:none}
:root[data-theme="light"] .moon{display:none}:root[data-theme="light"] .sun{display:block}
@media (prefers-color-scheme:light){:root:not([data-theme]) .moon{display:block}}
@media (prefers-color-scheme:dark){:root:not([data-theme]) .moon{display:none}:root:not([data-theme]) .sun{display:block}}
:root[data-theme="dark"] .moon{display:none}:root[data-theme="dark"] .sun{display:block}
main{padding:24px 28px 60px;min-width:0}
.top{display:flex;gap:14px;align-items:center;margin-bottom:24px}
.search{flex:1;display:flex;align-items:center;gap:12px;background:var(--pan);border-radius:16px;padding:0 18px;height:56px;box-shadow:var(--sh)}
.search svg{width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:2}
.search input{flex:1;border:0;background:none;outline:0;min-width:0}
.pill{height:56px;border-radius:16px;border:0;background:var(--pan);padding:0 20px;font-weight:600;box-shadow:var(--sh);white-space:nowrap}
.pill.pri{background:var(--acc);color:var(--onacc)}
.pill.t{display:none;width:56px;padding:0;place-items:center}
.pill.t svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.layout{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
.card{background:var(--pan);border-radius:22px;padding:22px;box-shadow:var(--sh)}
.card h3{font-size:16px;font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.card h3 small{font:500 12px "DM Sans",sans-serif;color:var(--mut)}
.hero{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:26px;padding:20px;margin-bottom:34px}
.art{border-radius:16px;min-height:230px;position:relative;overflow:hidden;display:grid;place-items:center;color:rgba(255,255,255,.92);font:700 84px Sora,sans-serif}
.art::after{content:"";position:absolute;width:120%;height:46%;left:-10%;bottom:-8%;background:rgba(255,255,255,.14);border-radius:50%;filter:blur(2px)}
.eyebrow{font-size:12px;color:var(--acc);font-weight:600;text-transform:uppercase;letter-spacing:.12em}
.hero h2{font-size:clamp(22px,3vw,30px);margin:6px 0 4px;line-height:1.15}
.host{color:var(--mut);font-size:14px;overflow-wrap:anywhere}
.meta{display:flex;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin:18px 0;color:var(--mut);font-size:13px}
.meta b{display:block;color:var(--ink);font:600 16px Sora,sans-serif;margin-top:2px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:13px 22px;font-weight:600;background:var(--pan2);text-decoration:none;color:var(--ink);display:inline-block}
.btn.pri{background:var(--acc);color:var(--onacc)}
h1{font-size:clamp(28px,4vw,38px);font-weight:700;margin-bottom:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.tab{border:0;background:none;color:var(--mut);padding:8px 16px;border-radius:99px;font-weight:600}
.tab.on{background:var(--pan);color:var(--ink);box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:30px}
.item{position:relative;display:block;text-decoration:none;color:inherit;background:var(--pan);border-radius:20px;padding:12px;box-shadow:var(--sh);transition:transform .15s}
.item:hover{transform:translateY(-3px)}
.item .art{min-height:0;height:112px;font-size:44px;border-radius:14px}
.item .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:12px}
.item .n{font:600 15px Sora,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tag{font-size:11px;color:var(--acc);font-weight:600;white-space:nowrap}
.item .u{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec{font:600 12px "DM Sans",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:0 0 12px}
.del{position:absolute;top:18px;right:18px;border:0;background:rgba(0,0,0,.45);color:#fff;width:26px;height:26px;border-radius:9px;opacity:0;line-height:1}
.item:hover .del,.del:focus{opacity:1}
@media(hover:none){.del{opacity:.8}}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:12px;border:0;background:none;padding:8px;border-radius:14px;text-align:left;width:100%}
.li:hover,.li.on{background:var(--pan2)}
.li .d{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;font:700 14px Sora,sans-serif}
.li span{flex:1;font-weight:500}.li em{font-style:normal;color:var(--mut);font-size:13px}
.stat{display:flex;justify-content:space-between;background:var(--pan2);border-radius:14px;padding:13px 16px;margin-top:8px;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:10px;height:90px;margin-bottom:12px}
.bar{flex:1;border-radius:9px 9px 4px 4px;background:linear-gradient(var(--acc),transparent);min-height:8px;opacity:.9}
.add{display:none;margin-bottom:24px;grid-template-columns:1fr 1.4fr 1fr auto;gap:10px;align-items:end}
.add.open{display:grid}
.add label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut)}
.add input,.add select{background:var(--pan2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:0;min-width:0}
.add input:focus,.add select:focus{border-color:var(--acc)}
.empty{color:var(--mut);padding:30px 0}
.foot{display:flex;gap:10px}.foot button{border:0;background:none;color:var(--mut);font-size:13px;text-decoration:underline}
@media(max-width:1080px){.layout{grid-template-columns:1fr}}
@media(max-width:760px){.app{grid-template-columns:1fr}aside.nav{display:none}main{padding:16px}.pill.t{display:grid}.hero{grid-template-columns:1fr}.add.open{grid-template-columns:1fr}.pill{padding:0 14px}}
</style>
</head>
<body>
<div class="app">
<aside class="nav">
  <div class="logo">R</div><div class="brand">Refs</div>
  <div id="nav" style="display:flex;flex-direction:column;gap:6px"></div>
  <div class="sp"></div>
  <button class="theme" id="th" aria-label="Cambiar tema" title="Cambiar tema">
    <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/></svg>
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
  </button>
</aside>
<main>
  <div class="top">
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Buscar recurso, categoría o sitio…" aria-label="Buscar"></label>
    <button class="pill t" id="th2" aria-label="Cambiar tema"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg></button>
    <button class="pill pri" id="tog">+ Agregar</button>
  </div>
  <form class="card add" id="f">
    <label>Nombre<input id="n" required placeholder="Ej. Coolors"></label>
    <label>URL<input id="u" required placeholder="coolors.co"></label>
    <label>Categoría<select id="c"></select></label>
    <button class="btn pri">Guardar</button>
    <label id="nl" style="display:none;grid-column:1/-1">Nombre de la nueva categoría<input id="nc" placeholder="Ej. Tipografías"></label>
  </form>
  <div class="layout">
    <div>
      <div class="card hero" id="hero"></div>
      <h1>Todas las referencias</h1>
      <div class="tabs" id="tabs"></div>
      <div id="out"></div>
      <div class="foot"><button id="exp">Exportar JSON</button><button id="rst">Restablecer</button></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:20px">
      <div class="card"><h3>Categorías <small id="cn"></small></h3><div class="list" id="cl"></div></div>
      <div class="card"><h3>Estadísticas</h3><div class="bars" id="bars"></div><div class="stat"><span>Recursos</span><span id="s1"></span></div><div class="stat"><span>Categorías</span><span id="s2"></span></div></div>
    </div>
  </div>
</main>
</div>
<script>
const KEY="refs-diseno-v1",TK="refs-tema";
const DEF=[
 {n:"Patrones SVG",u:"https://bookofshapes.com/",c:"Texturas"},
 {n:"Texturas 4K",u:"https://resourceboy.com/",c:"Texturas"},
 {n:"Texturas realistas",u:"https://texturefabrik.com/",c:"Texturas"},
 {n:"Doppio · Motion graphics",u:"https://doppio.design/",c:"Animaciones"},
 {n:"Logo Motion · Animación de logo",u:"https://www.logomotion.design/",c:"Animaciones"},
 {n:"Book Animator · Portadas de libro",u:"https://bookanimator.de/",c:"Mockups"},
 {n:"Cosmos",u:"https://www.cosmos.so/",c:"Inspiración"}
];
const $=id=>document.getElementById(id);
let S=load(),filter="Todas",feat=null;
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.length)return s}catch(e){}return DEF.map(x=>({...x}))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const cats=()=>[...new Set(S.map(x=>x.c))];
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return u}};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const hue=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))%360;return h};
const grad=s=>{const h=hue(s);return `linear-gradient(135deg,hsl(${h} 70% 55%),hsl(${(h+55)%360} 75% 28%))`};
const art=(x,cls="")=>`<div class="art ${cls}" style="background:${grad(x.n)}">${esc(x.n[0].toUpperCase())}</div>`;

function theme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem(TK,t)}catch(e){}}
function toggle(){const d=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");theme(d==="dark"?"light":"dark")}
try{const t=localStorage.getItem(TK);if(t)document.documentElement.dataset.theme=t}catch(e){}
$("th").onclick=$("th2").onclick=toggle;

function render(){
  const cs=cats(),q=$("q").value.toLowerCase().trim();
  if(filter!=="Todas"&&!cs.includes(filter))filter="Todas";
  $("tabs").innerHTML=["Todas",...cs].map(c=>`<button class="tab ${c===filter?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("nav").innerHTML=["Todas",...cs].map(c=>`<button class="ni ${c===filter?"on":""}" data-c="${esc(c)}" title="${esc(c)}">${c==="Todas"?"★":esc(c[0].toUpperCase())}</button>`).join("");
  $("cl").innerHTML=cs.map(c=>`<button class="li ${c===filter?"on":""}" data-c="${esc(c)}"><div class="d" style="background:${grad(c)}">${esc(c[0].toUpperCase())}</div><span>${esc(c)}</span><em>${S.filter(x=>x.c===c).length}</em></button>`).join("");
  $("cn").textContent=cs.length;
  const max=Math.max(...cs.map(c=>S.filter(x=>x.c===c).length),1);
  $("bars").innerHTML=cs.map(c=>`<div class="bar" title="${esc(c)}" style="height:${Math.max(10,S.filter(x=>x.c===c).length/max*100)}%"></div>`).join("");
  $("s1").textContent=S.length;$("s2").textContent=cs.length;
  const cur=$("c").value;
  $("c").innerHTML=cs.map(c=>`<option>${esc(c)}</option>`).join("")+`<option value="__new">+ Nueva categoría…</option>`;
  if([...$("c").options].some(o=>o.value===cur))$("c").value=cur;
  if(!S.includes(feat))feat=S[Math.floor(Math.random()*S.length)];
  $("hero").style.display=feat?"grid":"none";
  if(feat)$("hero").innerHTML=`${art(feat)}<div style="display:flex;flex-direction:column"><div class="eyebrow">Recurso destacado</div><h2>${esc(feat.n)}</h2><div class="host">${esc(host(feat.u))}</div><div class="meta"><div>Categoría<b>${esc(feat.c)}</b></div><div>En la categoría<b>${S.filter(x=>x.c===feat.c).length} recursos</b></div></div><div class="btns" style="margin-top:auto"><a class="btn pri" href="${esc(feat.u)}" target="_blank" rel="noopener noreferrer">Visitar sitio</a><button class="btn" id="rnd">Otro al azar</button></div></div>`;
  let html="";
  for(const c of cs){
    if(filter!=="Todas"&&c!==filter)continue;
    const it=S.map((x,i)=>({...x,i})).filter(x=>x.c===c&&(!q||(x.n+x.u+x.c).toLowerCase().includes(q)));
    if(!it.length)continue;
    html+=`<div class="sec">${esc(c)} · ${it.length}</div><div class="grid">`+it.map(x=>`<a class="item" href="${esc(x.u)}" target="_blank" rel="noopener noreferrer">${art(x)}<div class="row"><span class="n">${esc(x.n)}</span><span class="tag">${esc(x.c)}</span></div><div class="u">${esc(host(x.u))}</div><button class="del" data-i="${x.i}" title="Eliminar" aria-label="Eliminar">×</button></a>`).join("")+`</div>`;
  }
  $("out").innerHTML=html||`<div class="empty">No hay resultados.</div>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-c]");if(b){filter=b.dataset.c;render();return}
  if(e.target.id==="rnd"){feat=S[Math.floor(Math.random()*S.length)];render()}
});
$("q").oninput=render;
$("tog").onclick=()=>{$("f").classList.toggle("open");if($("f").classList.contains("open"))$("n").focus()};
$("c").onchange=()=>{const nw=$("c").value==="__new";$("nl").style.display=nw?"flex":"none";if(nw)$("nc").focus()};
$("f").onsubmit=e=>{
  e.preventDefault();
  let u=$("u").value.trim();if(!/^https?:\/\//i.test(u))u="https://"+u;
  let c=$("c").value;if(c==="__new")c=$("nc").value.trim();
  if(!c)return $("nc").focus();
  S.push({n:$("n").value.trim(),u,c});save();
  $("f").reset();$("nl").style.display="none";render();$("c").value=c;$("n").focus();
};
$("out").onclick=e=>{const d=e.target.closest(".del");if(d){e.preventDefault();S.splice(+d.dataset.i,1);save();render()}};
$("exp").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(JSON.stringify(S,null,1)).then(()=>{$("exp").textContent="¡Copiado!";setTimeout(()=>$("exp").textContent="Exportar JSON",1500)}).catch(()=>{})};
$("rst").onclick=()=>{if(confirm("¿Restablecer a las referencias originales? Se perderán los cambios.")){S=DEF.map(x=>({...x}));save();filter="Todas";render()}};
render();
</script>
</body>
</html>
